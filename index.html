<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Particle Vortex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ui-container">
        <h1>VORTEX CORE</h1>
        <p>Move your mouse to distort reality. Click to burst.</p>
    </div>
    <canvas id="vortexCanvas"></canvas>

    <script src="script.js"></script>
</body>
<style>
{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #05050a;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

.ui-container {
    position: absolute;
    top: 10%;
    left: 50%;
    transform: translate(-50%, -10%);
    z-index: 10;
    text-align: center;
    color: #ffffff;
    pointer-events: none; /* Allows mouse movements to pass through to canvas */
}

h1 {
    font-size: 2.5rem;
    letter-spacing: 8px;
    text-transform: uppercase;
    text-shadow: 0 0 20px rgba(0, 238, 255, 0.6);
    margin-bottom: 5px;
}

p {
    font-size: 0.9rem;
    letter-spacing: 2px;
    color: rgba(255, 255, 255, 0.5);
}
</style>

</script>
